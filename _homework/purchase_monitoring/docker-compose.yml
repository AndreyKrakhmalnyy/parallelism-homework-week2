services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP__PORT}:8000"
    volumes:
      - ".:/src"
    depends_on:
      migration:
        condition: service_completed_successfully
    command: ["sh", "-c", "uv run uvicorn src.main:app --host ${APP_HOST} --port ${APP__PORT} --reload"]

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES__DB}
      POSTGRES_USER: ${POSTGRES__USER}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD}
    ports:
      - "${POSTGRES__PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES__USER} -d ${POSTGRES__DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migration:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ".env"
    volumes:
      - ".:/src"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "uv run alembic upgrade head"]

volumes:
  postgres_data: