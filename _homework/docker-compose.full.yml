x-postgres-host: &postgres_host
  POSTGRES__HOST: afisha-db

services:
  afisha-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES__DB}
      POSTGRES_USER: ${POSTGRES__USER}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD}
    ports:
      - "${POSTGRES__PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES__USER} -d ${POSTGRES__DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  payment-api:
    build: ./afisha/mock_apis/payment
    ports:
      - "${CONNECTORS__PAYMENT__PORT}:9001"

  protection-api:
    build: ./afisha/mock_apis/protection
    ports:
      - "${CONNECTORS__PROTECTION__PORT}:9002"

  redis:
    image: redis:7-alpine
    ports:
      - "7379:${REDIS__PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  afisha-app:
    build:
      context: ./afisha
      dockerfile: Dockerfile
    env_file:
      - "./afisha/.env"
    environment:
      <<: *postgres_host
    ports:
      - "${AFISHA_APP_PORT}:${AFISHA_APP_PORT}"
    volumes:
      - "./afisha/:/src"
    depends_on:
      payment-api:
        condition: service_started
      protection-api:
        condition: service_started
      afisha-migration:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    command: ["sh", "-c", "uv run uvicorn app.main:app --host $$APP__HOST --port $$APP__PORT --reload"]

  afisha-migration:
    build:
      context: ./afisha
      dockerfile: Dockerfile
    env_file:
      - "./afisha/.env"
    environment:
      <<: *postgres_host
    volumes:
      - "./afisha/:/src"
    depends_on:
      afisha-db:
        condition: service_healthy
    command: ["sh", "-c", "uv run alembic upgrade head"]

  taskiq-cpu-worker:
    build:
      context: ./afisha
      dockerfile: Dockerfile
    env_file:
      - "./afisha/.env"
    environment:
      <<: *postgres_host
    command: uv run taskiq worker app.infrastructure.taskiq.app:cpu_broker app.infrastructure.taskiq.tasks  --workers=3 --max-async-tasks 1 --max-prefetch 1
    volumes:
      - ./afisha/app/reports/docs:/src/app/reports/docs
    depends_on:
      afisha-migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  afisha-taskiq-asyncio-worker:
    build:
      context: ./afisha
      dockerfile: Dockerfile
    env_file:
      - "./afisha/.env"
    environment:
      <<: *postgres_host
    command: uv run taskiq worker app.infrastructure.taskiq.app:asyncio_broker app.infrastructure.taskiq.tasks
    volumes:
      - "./afisha/:/src"
    depends_on:
      afisha-migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  afisha-taskiq-scheduler-worker:
    build:
      context: ./afisha
      dockerfile: Dockerfile
    env_file:
      - "./afisha/.env"
    environment:
      <<: *postgres_host
    command: uv run taskiq scheduler app.infrastructure.taskiq.app:scheduler app.infrastructure.taskiq.tasks
    volumes:
      - "./afisha/:/src"
    depends_on:
      afisha-migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # docker exec -it 093d1bf6fb38 uv run ipython
  purchase-monitoring-app:
    build:
      context: ./purchase_monitoring
      dockerfile: Dockerfile
    env_file:
      - "./purchase_monitoring/.env"
    environment:
      <<: *postgres_host
    ports:
      - "${PURCHASE_MONITORING_APP_PORT}:${PURCHASE_MONITORING_APP_PORT}"
    volumes:
      - "./purchase_monitoring/:/src"
    depends_on:
      purchase-monitoring-migration:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    command: ["sh", "-c", "uv run uvicorn src.main:app --host $$APP__HOST --port $$APP__PORT --reload"]

  purchase-monitoring-migration:
    build:
      context: ./purchase_monitoring
      dockerfile: Dockerfile
    env_file:
      - "./purchase_monitoring/.env"
    environment:
      <<: *postgres_host
    volumes:
      - "./purchase_monitoring/:/src"
    depends_on:
      afisha-db:
        condition: service_healthy
    command: ["sh", "-c", "uv run alembic upgrade head"]

  kafka:
    image: bitnamilegacy/kafka:3.7
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:29092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
    volumes:
      - kafka_data:/bitnami/kafka

  kafka-init:
    image: bitnamilegacy/kafka:3.7
    depends_on:
      kafka:
        condition: service_started
    command:
      - /bin/bash
      - -lc
      - |
        KAFKA_TOPICS=/opt/bitnami/kafka/bin/kafka-topics.sh
        for i in {1..30}; do
          $$KAFKA_TOPICS --bootstrap-server kafka:29092 --list >/dev/null 2>&1 && break
          sleep 2
        done
        $$KAFKA_TOPICS --bootstrap-server kafka:29092 --create --if-not-exists --topic ${KAFKA_PURCHASE_TICKET_TOPIC} --partitions 3 --replication-factor 1
        $$KAFKA_TOPICS --bootstrap-server kafka:29092 --alter --topic ${KAFKA_PURCHASE_TICKET_TOPIC} --partitions 3 || true

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_started
    environment:
      KAFKA_CLUSTERS_0_NAME: afisha-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  kafka_data: