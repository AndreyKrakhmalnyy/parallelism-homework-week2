services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES__DB}
      POSTGRES_USER: ${POSTGRES__USER}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD}
    ports:
      - "${POSTGRES__PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES__USER} -d ${POSTGRES__DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  payment-api:
    build: ./mock_apis/payment
    ports:
      - "${CONNECTORS__PAYMENT__PORT}:9001"

  protection-api:
    build: ./mock_apis/protection
    ports:
      - "${CONNECTORS__PROTECTION__PORT}:9002"

  redis:
    image: redis:7-alpine
    ports:
      - "7379:${REDIS__PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # app запускаем локально: сначала `uv run alembic upgrade head`
  # потом `uv run uvicorn app.main:app --reload`
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP__PORT}:8000"
    volumes:
      - .:/src
    depends_on:
      db:
        condition: service_healthy
      payment-api:
        condition: service_started
      protection-api:
        condition: service_started
      migration:
        condition: service_completed_successfully
        #--workers ${APP__WORKERS}
    command: ["sh", "-c", "uv run alembic upgrade head && uv run uvicorn app.main:app --host ${APP__HOST} --port ${APP__PORT} --reload"]

  migration:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - .:/src
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "uv run alembic upgrade head"]

  taskiq-cpu-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: uv run taskiq worker app.infrastructure.taskiq.app:cpu_broker app.infrastructure.taskiq.tasks  --workers=3 --max-async-tasks 1 --max-prefetch 1
    volumes:
      - ./app/reports/docs:/src/app/reports/docs
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  taskiq-asyncio-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: uv run taskiq worker app.infrastructure.taskiq.app:asyncio_broker app.infrastructure.taskiq.tasks
    volumes:
     - .:/src
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      
  taskiq-scheduler-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: uv run taskiq scheduler app.infrastructure.taskiq.app:scheduler app.infrastructure.taskiq.tasks
    volumes:
     - .:/src
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  purchase-monitoring:
    build:
      context: ../../purchase_monitoring
      dockerfile: Dockerfile
    env_file:
      

volumes:
  postgres_data:
